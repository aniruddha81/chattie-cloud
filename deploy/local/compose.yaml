# Local stack: three chat instances behind a proxy, one outbox publisher,
# Postgres and Redis. Development only; the secret below is not a real secret.
#
#   docker compose -f deploy/local/compose.yaml up
#
# This pulls the image that GitHub Actions built from main. Add --build to
# build from the code on your disk instead (CI does this to test each commit).
#
#   http://localhost:8080          the proxy, as a browser would use it
#   http://localhost:8081..8083    each instance directly, for tests

name: chattie

x-app: &app
  build: ../..
  image: ghcr.io/aniruddha81/chattie-cloud:latest
  environment:
    DATABASE_URL: postgres://chattie:chattie@postgres:5432/chattie?pool_max_conns=10
    REDIS_URL: redis://redis:6379
    SESSION_SECRET: local-development-only-secret-0123456789
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  proxy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [app1, app2, app3]

  app1: { <<: *app, hostname: app1, ports: ["8081:8080"] }
  app2: { <<: *app, hostname: app2, ports: ["8082:8080"] }
  app3: { <<: *app, hostname: app3, ports: ["8083:8080"] }

  publisher: { <<: *app, hostname: publisher, command: ["publisher"] }

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chattie
      POSTGRES_PASSWORD: chattie
      POSTGRES_DB: chattie
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chattie"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
